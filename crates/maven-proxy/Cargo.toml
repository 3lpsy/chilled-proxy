[package]
name = "maven-proxy"
description = "Caching Maven repository proxy with metadata age-gating"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "maven_proxy"
path = "src/lib.rs"

[dependencies]
chilled-core = { path = "../chilled-core" }
url.workspace = true
log.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
bytes.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true

[dev-dependencies]
chilled-testkit = { path = "../chilled-testkit" }
reqwest = { workspace = true, features = ["json"] }
wiremock.workspace = true
tempfile.workspace = true
serde_json.workspace = true
