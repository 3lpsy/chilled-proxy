# wasm32 only (hence not in default-members). Plain cargo + wasm-bindgen-cli,
# no `dx`: a pure SPA without asset! macros gains nothing from it.
[package]
name = "chilled-ui"
description = "Dioxus single-page web UI for chilled-proxy, embedded by chilled-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "chilled-ui"
path = "src/main.rs"

[dependencies]
chilled-wire = { path = "../chilled-wire" }
dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "Document",
  "Element",
  "EventSource",
  "Headers",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "Location",
  "MessageEvent",
  "Request",
  "RequestInit",
  "Response",
  "Window",
]
