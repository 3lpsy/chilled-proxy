# chilled-proxy builds on two upstream projects, under their MIT OR Apache-2.0 terms:
#   * crates-io-proxy by Sergey Kvachonok (ravenexp) — the caching proxy core.
#     https://github.com/ravenexp/crates-io-proxy
#   * menhera.org's crates.io cooldown proxy (metastable-void) — the sparse-index
#     age-gating logic. Credit and thanks to both.

[workspace]
resolver = "2"
members = ["crates/*"]
# chilled-web is wasm32-only, so host builds exclude it via this explicit list.
# Cargo has no glob-minus-one: new crates must be added here too.
default-members = [
    "crates/chilled-wire",
    "crates/chilled-core",
    "crates/chilled-proxy",
    "crates/chilled-testkit",
    "crates/chilled-api",
    "crates/crates-proxy",
    "crates/maven-proxy",
    "crates/npm-proxy",
    "crates/pypi-proxy",
]

[workspace.package]
version = "1.0.0"
authors = ["3lpsy"]
edition = "2021"
homepage = "https://github.com/3lpsy/chilled-proxy"
repository = "https://github.com/3lpsy/chilled-proxy"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
url = "2.5"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
percent-encoding = "2"
wiremock = "0.6"
tempfile = "3"
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
argon2 = { version = "0.5", features = ["std"] }
# Direct dep only to switch on OsRng for salt generation (argon2 re-exports it).
password-hash = { version = "0.5", features = ["getrandom"] }
include_dir = "0.7"
getrandom = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
dioxus = { version = "0.7.10", features = ["web", "router", "document"] }
# Pinned exactly: the wasm-bindgen CLI that post-processes the wasm must match
# the crate version in this lockfile (asserted by `just _ui-check-wbg`).
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[profile.release]
lto = true
strip = "debuginfo"

# Small wasm for the UI; panic=abort drops unwinding machinery.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
panic = "abort"
