name: Build and publish container image

# Builds the linux/amd64 Docker image and publishes it to the GitHub Container
# Registry (ghcr.io). Pull requests build only (to catch breakage) and never
# push or sign.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny all permissions by default; the build job opts into the minimum it needs.
permissions: {}

# A newer run for the same ref supersedes an in-progress one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repo
      packages: write # push the image to ghcr.io
      id-token: write # OIDC token to sign the provenance attestation
      attestations: write # record the build provenance attestation

    steps:
      # Actions are pinned to commit SHAs (not mutable tags) to prevent a
      # compromised upstream tag from injecting code.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the git token on the runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Lower-case the owner/repo for use as the image name (ghcr requires it).
      - name: Compute image name
        run: echo "IMAGE=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      # Authenticate to ghcr.io with the built-in token. Skipped for pull
      # requests (which must not push), so fork PRs never touch the registry.
      - name: Log in to the Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-arch image: skip the inline provenance manifest entry; a
          # signed attestation is produced separately below.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed, verifiable build provenance (SLSA). Verify a pulled image with:
      #   gh attestation verify oci://ghcr.io/<owner>/chilled-proxy:<tag> \
      #     --repo <owner>/chilled-proxy
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
